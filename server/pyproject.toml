[project]
name = "pupil-server"
version = "0.0.0"
description = "Pupil sidecar: agent backends, and database."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "claude-agent-sdk>=0.2.128",
    "openai-codex==0.163.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "psutil>=6",
    "ruff>=0.8",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pupil_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to a real model, and is billed for it"]

[tool.ruff]
line-length = 100
src = ["src"]
# Recorded data, not sources. Ruff reads a .ipynb as Python and reports on cells nobody wrote.
extend-exclude = ["tests/fixtures"]
